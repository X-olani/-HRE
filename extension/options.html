<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CABC HRE Capture — Settings</title>
    <style>
      body { font-family: Roboto, system-ui, sans-serif; color: #000; background: #fafafa; max-width: 480px; margin: 40px auto; padding: 0 20px; }
      h1 { font-size: 18px; }
      .dot { display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px; }
      label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#4b4f58; margin:16px 0 4px; }
      input { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font-size:14px; box-sizing:border-box; }
      button { margin-top:18px; background:#3299cc; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
      .ok { color:#2e7d32; font-size:13px; margin-top:10px; }
      .hint { color:#4b4f58; font-size:12px; margin-top:6px; line-height:1.5; }
    </style>
  </head>
  <body>
    <h1>
      <span class="dot" style="background:#3299cc"></span><span class="dot" style="background:#d7d733"></span><span class="dot" style="background:#000"></span>
      HRE Capture settings
    </h1>
    <p class="hint">Get your App URL and token from the HRE Monitor under <strong>Settings → Capture extension token</strong>.</p>
    <label for="appUrl">App URL</label>
    <input id="appUrl" placeholder="https://hre.cabc.org.za" />
    <label for="token">Capture token</label>
    <input id="token" placeholder="hre_…" />
    <button id="save">Save</button>
    <div id="msg" class="ok"></div>
    <p class="hint">Then open any post on X, TikTok, Facebook or YouTube and click the HRE Capture toolbar button. It screenshots the page and opens a prefilled draft entry.</p>
    <script src="options.js"></script>
  </body>
</html>
