services:
  app:
    build: .
    image: cabc-hre-monitor
    container_name: hre-monitor
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=./data/hre.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
